<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>露營小助手</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f1ea;
    --panel: #ffffff;
    --accent: #2f6d4f;
    --accent-dark: #234f39;
    --text: #24312a;
    --muted: #7a8a80;
    --bubble-user: #2f6d4f;
    --bubble-bot: #eef1ec;
    --border: #dfe3de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    box-shadow: 0 0 24px rgba(0,0,0,0.06);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 17px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .new-chat {
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  header .new-chat:hover { background: var(--bg); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
  }
  /* AI 回覆經 renderMarkdown 轉成 HTML 元素後，重置預設邊距避免氣泡裡空隙過大 */
  .bubble p, .bubble ul, .bubble ol, .bubble h4, .bubble h5, .bubble h6 {
    margin: 0 0 6px 0;
  }
  .bubble p:last-child, .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { padding-left: 20px; }
  .bubble h4, .bubble h5, .bubble h6 { font-size: 1em; font-weight: 700; }
  .bubble br { line-height: 1.8; }
  .msg-row.user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-row.bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg-row.error .bubble {
    background: #fbe7e7;
    color: #9a3b3b;
    border: 1px solid #f0c4c4;
  }
  .typing {
    display: flex;
    gap: 4px;
    padding: 12px 14px;
  }
  .typing span {
    width: 6px; height: 6px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  form {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14.5px;
    font-family: inherit;
    max-height: 120px;
    line-height: 1.4;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14.5px;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.send:hover { background: var(--accent-dark); }
  button.send:disabled { background: #b9c3bc; cursor: not-allowed; }

  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 20px;
  }
  .empty-hint .tips {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .empty-hint .tip {
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    background: var(--bg);
    color: var(--text);
  }
  .empty-hint .tip:hover { background: var(--bubble-bot); }

  .offline-hint {
    padding: 10px 16px;
    text-align: center;
    font-size: 13px;
    color: #9a3b3b;
    background: #fbe7e7;
    border-top: 1px solid #f0c4c4;
  }

  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) { }
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c211d;
      --panel: #242a25;
      --text: #e7ece7;
      --muted: #8a978e;
      --border: #333a34;
      --bubble-bot: #2f362f;
      --bubble-user: #3d8b62;
      --accent: #3d8b62;
      --accent-dark: #57a67c;
      color-scheme: dark;
    }
    .msg-row.error .bubble { background: #3a2323; color: #f2a8a8; border-color: #5a3232; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>露營小助手</h1>
      <button class="new-chat" id="newChatBtn">開新對話</button>
    </header>
    <div id="messages">
      <div class="empty-hint" id="emptyHint">
        問我台灣哪裡有露營地、或當地天氣如何吧。
        <div class="tips">
          <div class="tip" data-q="幫我找臺中市大里區最近的露營地">找臺中市大里區的露營地</div>
          <div class="tip" data-q="南投的露營地推薦，順便告訴我那邊天氣如何">南投露營地 + 天氣</div>
        </div>
      </div>
    </div>
    <form id="chatForm">
      <textarea id="input" rows="1" placeholder="輸入訊息"></textarea>
      <button type="submit" class="send" id="sendBtn">送出</button>
    </form>
    <div class="offline-hint" id="offlineHint" hidden>
      目前展示暫時關閉
    </div>
  </div>

<script>
  // 只要改這個常數，前端就能指到別的後端位置
  const API_URL = "/api/chat/";

  const messagesEl = document.getElementById("messages");
  const emptyHint = document.getElementById("emptyHint");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const newChatBtn = document.getElementById("newChatBtn");
  const offlineHint = document.getElementById("offlineHint");

  let sessionId = sessionStorage.getItem("camping_session_id") || null;

  // 進頁面先確認展示是否開放，關閉時直接鎖住輸入，不用等使用者送出才知道
  async function checkStatus() {
    try {
      const resp = await fetch(API_URL + "status");
      const data = await resp.json();
      if (!data.enabled) {
        input.disabled = true;
        sendBtn.disabled = true;
        input.placeholder = "展示暫時關閉";
        offlineHint.hidden = false;
      }
    } catch (err) {
      // 狀態查詢失敗就不擋輸入，讓送出時的錯誤處理去顯示真正的問題
    }
  }
  checkStatus();

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // 輕量 Markdown 轉換：只處理 AI 回覆常見的標題、粗體、斜體、清單、換行
  // 編號清單下方縮排的細項（如「1. 露營地」下面接「- 距離：」）會巢狀放進同一個 <li> 裡的子 <ul>，
  // 避免每個編號項目各自開一個新 <ol> 導致編號從 1 重新開始。
  function renderMarkdown(raw) {
    const lines = escapeHtml(raw).split("\n");
    let html = "";
    let listType = null;      // 目前開啟中的頂層清單："ul" | "ol" | null
    let inOrderedItem = false; // 是否還有一個 <ol><li> 尚未關閉（等著看有沒有子清單）
    let subListOpen = false;   // 該 <li> 裡的子 <ul> 是否已開啟

    function closeList() {
      if (subListOpen) { html += "</ul>"; subListOpen = false; }
      if (inOrderedItem) { html += "</li>"; inOrderedItem = false; }
      if (listType) { html += `</${listType}>`; listType = null; }
    }

    for (const line of lines) {
      const heading = line.match(/^(#{1,3})\s+(.*)/);
      const indentedUnordered = line.match(/^\s+[-*]\s+(.*)/); // 有縮排 -> 上一個編號項目的子清單
      const unordered = line.match(/^[-*]\s+(.*)/);
      const ordered = line.match(/^\d+\.\s+(.*)/);

      if (heading) {
        closeList();
        const level = heading[1].length + 3; // # -> h4, ## -> h5, ### -> h6（維持氣泡內字級不要太誇張）
        html += `<h${level}>${inline(heading[2])}</h${level}>`;
      } else if (indentedUnordered && listType === "ol" && inOrderedItem) {
        if (!subListOpen) { html += "<ul>"; subListOpen = true; }
        html += `<li>${inline(indentedUnordered[1])}</li>`;
      } else if (ordered) {
        if (listType !== "ol") {
          closeList();
          html += "<ol>";
          listType = "ol";
        } else {
          if (subListOpen) { html += "</ul>"; subListOpen = false; }
          if (inOrderedItem) { html += "</li>"; }
        }
        html += `<li>${inline(ordered[1])}`; // 先不關閉，讓後面可能出現的子清單塞進來
        inOrderedItem = true;
      } else if (unordered) {
        if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
        html += `<li>${inline(unordered[1])}</li>`;
      } else if (line.trim() === "") {
        closeList();
        html += "<br>";
      } else {
        closeList();
        html += `<p>${inline(line)}</p>`;
      }
    }
    closeList();
    return html;
  }

  // 處理單行內的粗體 **x**、斜體 *x*
  function inline(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, "<em>$1</em>");
  }

  function addBubble(role, text) {
    emptyHint.remove();
    const row = document.createElement("div");
    row.className = "msg-row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (role === "bot") {
      bubble.innerHTML = renderMarkdown(text); // AI 回覆才轉換 Markdown
    } else {
      bubble.textContent = text; // 使用者輸入、錯誤訊息維持原樣顯示，避免誤解析
    }
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typingRow";
    row.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
  }

  async function sendMessage(text) {
    if (sending) return; // 上一則還在處理中，忽略這次觸發，避免連續送出
    sending = true;

    addBubble("user", text);
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    addTyping();

    try {
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question: text }),
      });

      const data = await resp.json().catch(() => null);
      removeTyping();

      if (!resp.ok) {
        const detail = (data && data.detail) ? data.detail : `發生錯誤（狀態碼 ${resp.status}）`;
        addBubble("error", typeof detail === "string" ? detail : JSON.stringify(detail));
        return;
      }

      sessionId = data.session_id;
      sessionStorage.setItem("camping_session_id", sessionId);
      addBubble("bot", data.answer);
    } catch (err) {
      removeTyping();
      addBubble("error", "無法連線到伺服器，請確認後端是否啟動。");
    } finally {
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (sending) return;
    const text = input.value.trim();
    if (!text) return;
    sendMessage(text);
  });

  // 輸入法（注音、拼音等）選字時也會觸發 Enter，isComposing 用來排除這種情況
  let isComposing = false;
  input.addEventListener("compositionstart", () => { isComposing = true; });
  input.addEventListener("compositionend", () => { isComposing = false; });

  let sending = false;
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.shiftKey) return;
    if (isComposing || e.isComposing || e.keyCode === 229) return; // 229：部分瀏覽器組字期間的特殊代碼
    e.preventDefault();
    if (sending) return; // 避免同一次按鍵被重複處理造成連送
    form.requestSubmit();
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });

  document.querySelectorAll(".tip").forEach((tip) => {
    tip.addEventListener("click", () => sendMessage(tip.dataset.q));
  });

  newChatBtn.addEventListener("click", () => {
    sessionId = null;
    sessionStorage.removeItem("camping_session_id");
    messagesEl.innerHTML = "";
    location.reload();
  });
</script>
</body>
</html>
