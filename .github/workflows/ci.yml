name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  OPENAI_API_KEY: "test-key"
  OPENAI_MODEL: "test-model"
  QDRANT_URL: "http://localhost:6333"
  QDRANT_API_KEY: "test-key"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t camping-agent:ci .

      - name: Run container
        run: |
          docker run -d \
            --name camping-agent-ci \
            -p 8000:8000 \
            -e DATABASE_URL \
            -e OPENAI_API_KEY \
            -e OPENAI_MODEL \
            -e QDRANT_URL \
            -e QDRANT_API_KEY \
            camping-agent:ci

      - name: Smoke test
        run: |
          set -eu

          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/web/ > /dev/null; then
              break
            fi
            sleep 2
          done

          curl --fail --show-error http://localhost:8000/web/
          curl --fail --show-error http://localhost:8000/api/campsite/

      - name: Show container logs
        if: failure()
        run: docker logs camping-agent-ci